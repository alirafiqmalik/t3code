name: Fork Build & Release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even when composed source and controller fingerprint match the latest release'
        required: false
        default: true
        type: boolean
      build_desktop:
        description: 'Also build Linux x64 AppImage and macOS arm64 DMG/ZIP desktop installers'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '37 6 * * *'
  push:
    branches: [fork-ci]
    paths:
      - '.github/fork/**'
      - '.github/workflows/fork-build.yml'

permissions:
  contents: read

concurrency:
  group: fork-t3code-build
  cancel-in-progress: false

jobs:
  compose:
    name: Sync & Compose Fork
    if: github.repository == 'alirafiqmalik/t3code' && github.ref == 'refs/heads/fork-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      should_build: ${{ steps.metadata.outputs.should_build }}
      build_desktop: ${{ steps.metadata.outputs.build_desktop }}
      composed_sha: ${{ steps.metadata.outputs.composed_sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      controller_sha: ${{ steps.controller.outputs.sha }}
    steps:
      - name: Checkout fork-ci controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fork-ci
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - name: Record controller commit
        id: controller
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test composition & versioning scripts
        run: python3 -m unittest discover -s .github/fork -v

      - name: Sync main and compose pinned features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=$(python3 .github/fork/stack.py --repo . sync)
          mkdir -p "$RUNNER_TEMP/fork-source"
          python3 .github/fork/stack.py --repo . compose \
            --base "$upstream" --output "$RUNNER_TEMP/composed" \
            --report "$RUNNER_TEMP/fork-source/build-manifest.json" --check-prs
          git -C "$RUNNER_TEMP/composed" bundle create "$RUNNER_TEMP/fork-source/source.bundle" HEAD

      - name: Decide whether to build
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE_BUILD: ${{ inputs.force_build }}
          INPUT_BUILD_DESKTOP: ${{ inputs.build_desktop }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "${INPUT_FORCE_BUILD:-true}" = true ]; then args+=(--force); fi
          if [ "${INPUT_BUILD_DESKTOP:-false}" = true ]; then args+=(--build-desktop); fi
          python3 .github/fork/pipeline.py prepare --repo . \
            --composed-dir "$RUNNER_TEMP/composed" \
            --report "$RUNNER_TEMP/fork-source/build-manifest.json" "${args[@]}"

      - name: Upload composed source bundle
        if: steps.metadata.outputs.should_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-source
          path: ${{ runner.temp }}/fork-source/
          retention-days: 7
          if-no-files-found: error

  validate_and_bundle:
    name: Validate & Build JS Bundle
    needs: [compose]
    if: needs.compose.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download composed source bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-source
          path: ${{ runner.temp }}/fork-source

      - name: Restore exact composed source
        env:
          SOURCE_SHA: ${{ needs.compose.outputs.composed_sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "$RUNNER_TEMP/fork-source/source.bundle" .
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach "$SOURCE_SHA"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Setup Rust for resource-monitor tests
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Lint and format check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test resource-monitor (Rust)
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Test workspace packages
        run: vp run --parallel --concurrency-limit 2 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

      - name: Test fork CLI, installer, and release scripts
        run: >-
          vp test run
          apps/web/src/components/desktopUpdate.logic.test.ts
          apps/server/src/cli/update.test.ts
          scripts/install.test.ts
          scripts/build-cli-archive.test.ts
          scripts/build-npm-launcher.test.ts

      - name: Load public T3 Connect config from .env.example
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.example ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                T3CODE_CLERK_PUBLISHABLE_KEY|T3CODE_CLERK_JWT_TEMPLATE|T3CODE_CLERK_CLI_OAUTH_CLIENT_ID|T3CODE_RELAY_URL)
                  if [[ -n "$value" ]]; then
                    echo "$key=$value" >> "$GITHUB_ENV"
                  fi
                  ;;
              esac
            done < <(grep -E '^T3CODE_[A-Z0-9_]+=' .env.example || true)
          fi
          echo "T3CODE_TELEMETRY_CHANNEL=dev" >> "$GITHUB_ENV"

      - name: Align package versions to fork release version
        run: node scripts/update-release-package-versions.ts "${{ needs.compose.outputs.version }}"

      - name: Build JS bundle
        run: |
          set -euo pipefail
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          vp run "$script"
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi

      - name: Build npm launcher
        run: node scripts/build-npm-launcher.ts --version "${{ needs.compose.outputs.version }}" --output-dir npm-packages

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

      - name: Upload npm launcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-launcher
          path: npm-packages/t3.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          retention-days: 1

  build_linux_x64:
    name: Build & Smoke Linux x64
    needs: [compose, validate_and_bundle]
    if: needs.compose.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download composed source bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-source
          path: ${{ runner.temp }}/fork-source

      - name: Restore exact composed source
        env:
          SOURCE_SHA: ${{ needs.compose.outputs.composed_sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "$RUNNER_TEMP/fork-source/source.bundle" .
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach "$SOURCE_SHA"

      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - name: Resolve staged install cache
        id: stage_pnpm
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=fork-stage-pnpm-v1-linux-x64-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        id: stage_pnpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Load public T3 Connect config from .env.example
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.example ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                T3CODE_CLERK_PUBLISHABLE_KEY|T3CODE_CLERK_JWT_TEMPLATE|T3CODE_CLERK_CLI_OAUTH_CLIENT_ID|T3CODE_RELAY_URL)
                  if [[ -n "$value" ]]; then
                    echo "$key=$value" >> "$GITHUB_ENV"
                  fi
                  ;;
              esac
            done < <(grep -E '^T3CODE_[A-Z0-9_]+=' .env.example || true)
          fi
          echo "T3CODE_TELEMETRY_CHANNEL=dev" >> "$GITHUB_ENV"

      - name: Align package versions to fork release version
        run: node scripts/update-release-package-versions.ts "${{ needs.compose.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Restore web asset manifest
        run: |
          client=apps/server/dist/client
          if [[ -f "$client/vite-manifest.release.json" ]]; then
            mkdir -p "$client/.vite"
            mv "$client/vite-manifest.release.json" "$client/.vite/manifest.json"
          fi

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/t3-resource-monitor"

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: 'true'
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.compose.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.compose.outputs.version }}"

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0

      - name: Install Linux desktop build libraries
        if: needs.compose.outputs.build_desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick xvfb

      - name: Cache Electron download
        if: needs.compose.outputs.build_desktop == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        if: needs.compose.outputs.build_desktop == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build Linux AppImage
        if: needs.compose.outputs.build_desktop == 'true'
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: 'true'
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: 'true'
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.compose.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Smoke-test Linux AppImage
        if: needs.compose.outputs.build_desktop == 'true'
        run: |
          set -euo pipefail
          appimage=$(ls "$GITHUB_WORKSPACE"/release/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          xvfb-run -a node scripts/smoke-desktop-app.ts \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" \
            --executable "$RUNNER_TEMP/squashfs-root/t3code"

      - name: Upload Linux desktop artifacts
        if: needs.compose.outputs.build_desktop == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-x64
          path: release/*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Check staged install cache for new content
        id: stage_pnpm_changed
        run: |
          dir="${{ steps.stage_pnpm.outputs.dir }}"
          new=$(find "$dir/cache/v12" "$dir/store/v11/files" -type f -newer "$RUNNER_TEMP/desktop-stage-pnpm.marker" 2>/dev/null | wc -l | tr -d ' ')
          echo "changed=$([[ "$new" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save staged install cache
        if: steps.stage_pnpm_changed.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm_cache.outputs.cache-primary-key }}

  build_macos_arm64:
    name: Test, Build & Smoke macOS arm64
    needs: [compose, validate_and_bundle]
    if: needs.compose.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download composed source bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-source
          path: ${{ runner.temp }}/fork-source

      - name: Restore exact composed source
        env:
          SOURCE_SHA: ${{ needs.compose.outputs.composed_sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "$RUNNER_TEMP/fork-source/source.bundle" .
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach "$SOURCE_SHA"

      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - name: Resolve staged install cache
        id: stage_pnpm
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=fork-stage-pnpm-v1-mac-arm64-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        id: stage_pnpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Test resource-monitor on macOS (Rust)
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Test fork CLI, installer, and release suites on macOS
        run: >-
          vp test run
          packages/shared/src/cliRelease.test.ts
          apps/server/src/cli/update.test.ts
          apps/web/src/components/desktopUpdate.logic.test.ts
          apps/mobile/src/features/settings/environment-maintenance.test.ts
          scripts/install.test.ts
          scripts/build-cli-archive.test.ts
          scripts/build-npm-launcher.test.ts

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      - name: Load public T3 Connect config from .env.example
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.example ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                T3CODE_CLERK_PUBLISHABLE_KEY|T3CODE_CLERK_JWT_TEMPLATE|T3CODE_CLERK_CLI_OAUTH_CLIENT_ID|T3CODE_RELAY_URL)
                  if [[ -n "$value" ]]; then
                    echo "$key=$value" >> "$GITHUB_ENV"
                  fi
                  ;;
              esac
            done < <(grep -E '^T3CODE_[A-Z0-9_]+=' .env.example || true)
          fi
          echo "T3CODE_TELEMETRY_CHANNEL=dev" >> "$GITHUB_ENV"

      - name: Align package versions to fork release version
        run: node scripts/update-release-package-versions.ts "${{ needs.compose.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Restore web asset manifest
        run: |
          client=apps/server/dist/client
          if [[ -f "$client/vite-manifest.release.json" ]]; then
            mkdir -p "$client/.vite"
            mv "$client/vite-manifest.release.json" "$client/.vite/manifest.json"
          fi

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          target_dir="$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$target_dir/t3-resource-monitor"

      - name: Build CLI archive (ad-hoc signed)
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: 'true'
        run: |
          node scripts/build-cli-archive.ts \
            --platform mac \
            --arch arm64 \
            --version "${{ needs.compose.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test macOS CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.compose.outputs.version }}"

      - name: Upload macOS CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-mac-arm64
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0

      - name: Cache Electron download
        if: needs.compose.outputs.build_desktop == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        if: needs.compose.outputs.build_desktop == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build macOS DMG/ZIP
        if: needs.compose.outputs.build_desktop == 'true'
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: 'true'
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: 'true'
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.compose.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Smoke-test macOS DMG
        if: needs.compose.outputs.build_desktop == 'true'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/desktop-launch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls "$GITHUB_WORKSPACE"/release/*.dmg)"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app=$(ls -d "$mount"/*.app)
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" \
            --executable "$app/Contents/MacOS/$executable"

      - name: Upload macOS desktop artifacts
        if: needs.compose.outputs.build_desktop == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Check staged install cache for new content
        id: stage_pnpm_changed
        run: |
          dir="${{ steps.stage_pnpm.outputs.dir }}"
          new=$(find "$dir/cache/v12" "$dir/store/v11/files" -type f -newer "$RUNNER_TEMP/desktop-stage-pnpm.marker" 2>/dev/null | wc -l | tr -d ' ')
          echo "changed=$([[ "$new" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save staged install cache
        if: steps.stage_pnpm_changed.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm_cache.outputs.cache-primary-key }}

  publish:
    name: Publish Fork Release
    needs: [compose, validate_and_bundle, build_linux_x64, build_macos_arm64]
    if: ${{ !cancelled() && needs.compose.outputs.should_build == 'true' && needs.validate_and_bundle.result == 'success' && needs.build_linux_x64.result == 'success' && needs.build_macos_arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout fork-ci controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fork-ci
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - name: Download composed source bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-source
          path: ${{ runner.temp }}/fork-source

      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Download npm launcher
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-launcher
          path: ${{ runner.temp }}/release-assets

      - name: Download desktop artifacts
        if: needs.compose.outputs.build_desktop == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Write checksums and attach build manifest
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/fork-source/build-manifest.json" "$RUNNER_TEMP/release-assets/build-manifest.json"
          cd "$RUNNER_TEMP/release-assets"
          shopt -s nullglob
          archives=(t3-*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release & advance build/local
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.compose.outputs.composed_sha }}
          RELEASE_TAG: ${{ needs.compose.outputs.tag }}
          RELEASE_NAME: ${{ needs.compose.outputs.release_name }}
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/fork-source/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          python3 .github/fork/pipeline.py notes \
            --report "$RUNNER_TEMP/release-assets/build-manifest.json" \
            --destination "$RUNNER_TEMP/notes.md"
          git tag "$RELEASE_TAG" "$SOURCE_SHA"
          git -c core.hooksPath=/dev/null push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* \
            --verify-tag \
            --title "$RELEASE_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
          old=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/release-assets/build-manifest.json"))["previous_build_sha"])')
          git -c core.hooksPath=/dev/null push \
            --force-with-lease="refs/heads/build/local:$old" origin "$SOURCE_SHA:refs/heads/build/local"
          python3 .github/fork/stack.py --repo . retire-merged \
            --report "$RUNNER_TEMP/release-assets/build-manifest.json"
          echo "Fork release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
